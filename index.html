<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitTrack</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121212;
    --card: #181818;
    --elevated: #282828;
    --input: #3E3E3E;
    --accent: #1DB954;
    --accent-red: #E84040;
    --text: #FFFFFF;
    --text-sec: #B3B3B3;
    --text-muted: #535353;
    --nav-bg: #000000;
    --radius: 8px;
    --transition: 200ms ease;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000000;
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.4;
    touch-action: manipulation;
  }

  /* ── LANDSCAPE LOCK ── */
  #landscape-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; color: #fff; text-align: center; padding: 32px;
  }
  #landscape-overlay span:first-child { font-size: 64px; }
  #landscape-overlay span:last-child { font-size: 20px; font-weight: 700; }
  @media (orientation: landscape) {
    #landscape-overlay { display: flex; }
    #app { display: none !important; }
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    padding-bottom: 72px;
  }
  .screen.active { display: flex; }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; flex: 1; }
  .topbar .back-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 22px; padding: 4px; display: flex; align-items: center;
  }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--nav-bg);
    display: flex;
    border-top: 1px solid #1a1a1a;
    z-index: 100;
  }
  .nav-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 0 14px;
    background: none; border: none; cursor: pointer;
    color: var(--text-sec); transition: color var(--transition);
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  }
  .nav-tab svg { width: 24px; height: 24px; }
  .nav-tab.active { color: var(--accent); }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 12px 24px;
    border-radius: 999px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
    transition: opacity var(--transition), transform var(--transition);
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: transparent; color: var(--text); border: 2px solid var(--text); }
  .btn-danger { background: transparent; color: var(--accent-red); border: 2px solid var(--accent-red); }
  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-icon {
    background: none; border: none; cursor: pointer; color: var(--text-sec);
    padding: 6px; display: flex; align-items: center; justify-content: center;
    transition: color var(--transition);
    border-radius: 50%;
  }
  .btn-icon:hover { color: var(--text); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── INPUTS ── */
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 12px; color: var(--text-sec); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input[type="text"], input[type="number"] {
    background: var(--input); border: none; border-radius: var(--radius);
    color: var(--text); font-size: 15px; padding: 12px 14px;
    outline: none; width: 100%;
    transition: background var(--transition);
    -moz-appearance: textfield;
  }
  input[type="text"]:focus, input[type="number"]:focus { background: #4a4a4a; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  /* ── CARDS ── */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin: 0 16px 10px;
  }
  .card-elevated { background: var(--elevated); }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px;
  }
  .section-header h2 { font-size: 18px; font-weight: 700; }

  /* ── CHECKBOX ── */
  .check-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .check-wrap input[type="checkbox"] { display: none; }
  .check-box {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition); flex-shrink: 0;
  }
  .check-wrap input:checked + .check-box {
    background: var(--accent); border-color: var(--accent);
  }
  .check-wrap input:checked + .check-box::after {
    content: ''; display: block;
    width: 6px; height: 10px;
    border: 2px solid #000; border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 48px 16px; color: var(--text-muted); text-align: center;
  }
  .empty-state svg { width: 48px; height: 48px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ── WORKOUT LIST ── */
  .workout-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; margin: 0 16px 10px;
    cursor: pointer; transition: background var(--transition);
  }
  .workout-card:hover { background: var(--elevated); }
  .workout-card-info { flex: 1; min-width: 0; }
  .workout-card-name { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .workout-card-meta { font-size: 13px; color: var(--text-sec); margin-top: 3px; }
  .workout-card-actions { display: flex; gap: 4px; }

  /* ── EXERCISE BUILDER ── */
  .exercise-row {
    background: var(--elevated); border-radius: var(--radius);
    padding: 12px; margin: 0 16px 8px;
    transition: opacity 0.15s;
  }
  .exercise-row.dragging { opacity: 0.35; }
  .exercise-row-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .drag-handle {
    color: var(--text-muted); font-size: 20px; padding: 2px 6px;
    cursor: grab; touch-action: none; user-select: none; flex-shrink: 0;
    line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; }
  .exercise-fields {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .drag-insert-above {
    height: 3px; background: var(--accent); border-radius: 2px;
    margin: 0 16px 6px; display: none;
  }
  .drag-insert-above.show { display: block; }

  /* ── HIIT NATIVE INPUTS ── */
  .hiit-inputs-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .hiit-input-group {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .hiit-input-group .hig-label {
    font-size: 11px; color: var(--text-sec); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
  }
  .hiit-input-group input[type="number"] {
    width: 100%; text-align: center;
    font-size: 16px; font-weight: 700;
    padding: 14px 4px;
    background: var(--elevated); border: none; border-radius: var(--radius);
    color: var(--text); outline: none;
    -moz-appearance: textfield;
  }
  .hiit-input-group input[type="number"]:focus { background: #333; }
  .hiit-input-group input[type="number"]::-webkit-inner-spin-button,
  .hiit-input-group input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .hiit-input-group .hig-unit {
    font-size: 11px; color: var(--text-sec); text-align: center;
  }

  /* ── EXERCISE NATIVE INPUTS ── */
  .ex-input-group {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .ex-input-group .eig-label {
    font-size: 11px; color: var(--text-sec); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .ex-input-group input[type="number"] {
    width: 100%; text-align: center;
    font-size: 16px; font-weight: 700;
    padding: 10px 4px;
    background: var(--bg); border: none; border-radius: var(--radius);
    color: var(--text); outline: none;
    -moz-appearance: textfield;
  }
  .ex-input-group input[type="number"]:focus { background: #1e1e1e; }
  .ex-input-group input[type="number"]::-webkit-inner-spin-button,
  .ex-input-group input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  .ex-input-group .eig-unit {
    font-size: 11px; color: var(--text-sec); text-align: center;
  }

  /* ── ACTIVE WORKOUT ── */
  .session-timer-bar {
    background: var(--card); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .session-timer { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
  .rest-timer-overlay {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
  }
  .rest-timer-overlay h2 { font-size: 20px; color: var(--text-sec); }
  .rest-timer-count { font-size: 96px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; }
  .rest-timer-overlay .btn { margin-top: 16px; }

  .ex-session-card { background: var(--card); border-radius: var(--radius); margin: 0 16px 10px; overflow: hidden; }
  .ex-session-header { padding: 14px 16px 10px; font-size: 16px; font-weight: 700; }
  .set-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--bg);
    transition: background var(--transition);
  }
  .set-row.done { background: rgba(29,185,84,0.06); }
  .set-row.done .set-label, .set-row.done .set-info { color: var(--text-muted); text-decoration: line-through; }
  .set-label { font-size: 13px; font-weight: 700; color: var(--text-sec); min-width: 36px; }
  .set-info { flex: 1; font-size: 14px; color: var(--text-sec); }

  /* ── HISTORY ── */
  .history-card {
    background: var(--card); border-radius: var(--radius);
    margin: 0 16px 10px; overflow: hidden;
  }
  .history-card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer;
  }
  .history-card-left { flex: 1; min-width: 0; }
  .history-card-name { font-size: 15px; font-weight: 700; }
  .history-card-date { font-size: 12px; color: var(--text-sec); margin-top: 3px; }
  .history-card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .history-card-stats { display: flex; gap: 12px; }
  .history-stat { font-size: 12px; color: var(--text-sec); display: flex; flex-direction: column; align-items: flex-end; }
  .history-stat strong { font-size: 15px; color: var(--text); font-weight: 700; }
  .history-detail {
    display: none; padding: 0 16px 14px; border-top: 1px solid var(--elevated);
  }
  .history-detail.open { display: block; }
  .history-detail-ex { font-size: 13px; color: var(--text-sec); padding: 6px 0; border-bottom: 1px solid var(--elevated); }
  .history-detail-ex:last-child { border-bottom: none; }
  .history-delete-confirm {
    display: none; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 16px 12px; font-size: 13px; color: var(--text-sec);
    border-top: 1px solid var(--elevated);
  }
  .history-delete-confirm.show { display: flex; }
  .hdc-confirm { background: var(--accent-red); color: #fff; border: none; border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .hdc-cancel { background: var(--elevated); color: var(--text); border: none; border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* ── SUB-TABS ── */
  .sub-tabs {
    display: flex; gap: 0; padding: 0 16px 12px; overflow-x: auto;
  }
  .sub-tab {
    padding: 8px 20px; border-radius: 999px;
    background: none; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--text-sec);
    transition: all var(--transition); white-space: nowrap;
  }
  .sub-tab.active { background: var(--elevated); color: var(--text); }

  /* ── HIIT SCREEN ── */
  .hiit-config { padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }

  /* HIIT Timer Active */
  .hiit-active {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; padding: 24px 16px;
    text-align: center;
  }
  .hiit-phase {
    font-size: 36px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
  }
  .hiit-phase.work { color: var(--accent-red); }
  .hiit-phase.rest { color: var(--accent); }
  .hiit-countdown {
    font-size: 120px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .hiit-round { font-size: 20px; color: var(--text-sec); font-weight: 600; }
  .hiit-progress-bar {
    width: 100%; height: 6px; background: var(--elevated);
    border-radius: 999px; overflow: hidden;
  }
  .hiit-progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 999px; transition: width 0.5s linear;
  }
  .hiit-controls { display: flex; gap: 12px; margin-top: 8px; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .screen.active { animation: fadeIn 200ms ease; }

  /* ── HIIT HISTORY ── */
  .hiit-verlauf-section { padding: 0 16px 16px; }
  .hiit-verlauf-toggle {
    width: 100%; background: transparent; border: 2px solid var(--text-sec);
    color: var(--text-sec); border-radius: 999px; padding: 10px 20px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: color var(--transition), border-color var(--transition);
  }
  .hiit-verlauf-toggle:active { transform: scale(0.97); }
  .hiit-verlauf-list {
    margin-top: 12px; display: none; max-height: 340px;
    overflow-y: auto; border-radius: var(--radius);
  }
  .hiit-verlauf-list.open { display: block; }
  .hiit-hist-card {
    background: var(--card); border-radius: var(--radius);
    margin-bottom: 8px; overflow: hidden;
  }
  .hiit-hist-header {
    display: flex; align-items: center; padding: 12px 14px; gap: 8px;
  }
  .hiit-hist-info { flex: 1; min-width: 0; }
  .hiit-hist-date { font-size: 13px; font-weight: 700; }
  .hiit-hist-meta { font-size: 12px; color: var(--text-sec); margin-top: 3px; }
  .hiit-hist-del {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px; flex-shrink: 0;
    transition: color var(--transition); display: flex; align-items: center;
  }
  .hiit-hist-del:hover { color: var(--accent-red); }
  .hiit-hist-confirm {
    display: none; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 14px 10px; font-size: 12px; color: var(--text-sec);
    border-top: 1px solid var(--elevated);
  }
  .hiit-hist-confirm.show { display: flex; }
  .hiit-hist-empty {
    color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px 0;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--elevated); border-radius: 2px; }
</style>
</head>
<body>
<div id="landscape-overlay">
  <span>🔄</span>
  <span>Bitte Gerät drehen</span>
</div>

<div id="app">

  <!-- ══════════════════════════════ WORKOUTS SCREEN ══════════════════════════════ -->
  <div id="screen-workouts" class="screen active">
    <div class="topbar">
      <h1>Meine Workouts</h1>
      <button class="btn btn-primary btn-sm" onclick="showBuilderScreen(null)">+ Neu</button>
    </div>
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchWorkoutTab('list', this)">Workouts</button>
      <button class="sub-tab" onclick="switchWorkoutTab('history', this)">Verlauf</button>
    </div>
    <div id="workout-list-tab">
      <div id="workout-list"></div>
    </div>
    <div id="workout-history-tab" style="display:none;">
      <div id="history-list"></div>
    </div>
  </div>

  <!-- ══════════════════════════════ BUILDER SCREEN ══════════════════════════════ -->
  <div id="screen-builder" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="cancelBuilder()">&#8592;</button>
      <h1 id="builder-title">Workout erstellen</h1>
    </div>
    <div style="padding: 0 16px 12px;">
      <div class="input-group">
        <label>Workout-Name</label>
        <input type="text" id="workout-name-input" placeholder="z.B. Push Day A">
      </div>
    </div>
    <div class="section-header">
      <h2>Übungen</h2>
      <button class="btn btn-secondary btn-sm" onclick="addExerciseRow()">+ Übung</button>
    </div>
    <div id="exercise-list"></div>
    <div style="padding: 16px; display: flex; gap: 10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveWorkout()">Speichern</button>
      <button class="btn btn-secondary" onclick="cancelBuilder()">Abbrechen</button>
    </div>
  </div>

  <!-- ══════════════════════════════ ACTIVE WORKOUT SCREEN ══════════════════════════════ -->
  <div id="screen-active" class="screen">
    <div class="session-timer-bar">
      <div>
        <div style="font-size:12px;color:var(--text-sec);font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Trainingszeit</div>
        <div class="session-timer" id="session-clock">0:00</div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="text-align:right;">
          <div style="font-size:12px;color:var(--text-sec);">Pause (s)</div>
          <input type="number" id="rest-duration-input" value="60" min="5" max="300"
            style="width:58px;text-align:center;font-size:14px;padding:6px;background:var(--input);border:none;border-radius:6px;color:var(--text);">
        </div>
        <button class="btn btn-danger btn-sm" onclick="endWorkout()">Beenden</button>
      </div>
    </div>
    <div id="active-exercise-list" style="padding-top:8px;"></div>
    <div id="rest-overlay" class="rest-timer-overlay" style="display:none;">
      <h2>Pause</h2>
      <div class="rest-timer-count" id="rest-count">60</div>
      <div style="color:var(--text-sec);font-size:14px;">Nächste Übung / Satz</div>
      <button class="btn btn-secondary" onclick="skipRest()">Überspringen</button>
    </div>
  </div>

  <!-- ══════════════════════════════ HIIT SCREEN ══════════════════════════════ -->
  <div id="screen-hiit" class="screen">
    <div id="hiit-config-view">
      <div class="topbar"><h1>HIIT Timer</h1></div>
      <div class="hiit-config">
        <div class="hiit-inputs-row">
          <div class="hiit-input-group">
            <div class="hig-label">Runden</div>
            <input type="number" id="hiit-rounds" value="8" min="1" max="30" step="1">
            <div class="hig-unit">Runden</div>
          </div>
          <div class="hiit-input-group">
            <div class="hig-label">Belastung</div>
            <input type="number" id="hiit-work" value="40" min="10" max="300" step="30">
            <div class="hig-unit">Sekunden</div>
          </div>
          <div class="hiit-input-group">
            <div class="hig-label">Pause</div>
            <input type="number" id="hiit-rest" value="20" min="10" max="300" step="30">
            <div class="hig-unit">Sekunden</div>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="startHIIT()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Starten
        </button>
      </div>
      <div class="hiit-verlauf-section">
        <button class="hiit-verlauf-toggle" onclick="toggleHIITVerlauf(this)">Verlauf anzeigen</button>
        <div class="hiit-verlauf-list" id="hiit-verlauf-list"></div>
      </div>
    </div>
    <div id="hiit-active-view" style="display:none;flex-direction:column;flex:1;">
      <div class="hiit-active">
        <div class="hiit-phase" id="hiit-phase-label">BELASTUNG</div>
        <div class="hiit-countdown" id="hiit-countdown">40</div>
        <div class="hiit-round" id="hiit-round-label">Runde 1 / 8</div>
        <div class="hiit-progress-bar">
          <div class="hiit-progress-fill" id="hiit-progress-fill" style="width:100%"></div>
        </div>
        <div class="hiit-controls">
          <button class="btn btn-secondary" id="hiit-pause-btn" onclick="toggleHIITPause()">Pause</button>
          <button class="btn btn-danger" onclick="stopHIIT()">Stop</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════ BOTTOM NAV ══════════════════════════════ -->
  <nav id="bottom-nav">
    <button class="nav-tab active" onclick="navTo('workouts')" id="nav-workouts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 9.5l2 2.5-2 2.5M22 9.5l-2 2.5 2 2.5"/>
      </svg>
      Workouts
    </button>
    <button class="nav-tab" onclick="navTo('hiit')" id="nav-hiit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      HIIT
    </button>
  </nav>
</div>

<script>
// ═══════════════════════════════════════════════════
//  CONSTANTS & STORAGE
// ═══════════════════════════════════════════════════
const KEYS = {
  workouts:    'fittrack_workouts',
  history:     'fittrack_history',
  hiit:        'fittrack_hiit_config',
  hiitHistory: 'fittrack_hiit_history'
};

function load(key)        { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function loadObj(key, def){ try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function save(key, data)  { localStorage.setItem(key, JSON.stringify(data)); }

// ═══════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new AudioCtxClass(); return audioCtx; }

function beep(freq, duration, type = 'sine', volume = 0.4, delay = 0) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

function soundWorkStart()  { beep(880,0.1,'square',0.3,0); beep(880,0.1,'square',0.3,0.15); beep(1100,0.15,'square',0.35,0.3); }
function soundRestStart()  { beep(440, 0.6, 'sine', 0.35, 0); }
function soundEnd()        { beep(523,0.15,'sine',0.35,0); beep(659,0.15,'sine',0.35,0.15); beep(784,0.15,'sine',0.35,0.3); beep(1047,0.4,'sine',0.4,0.45); }
function soundRestBeep()   { beep(660, 0.12, 'sine', 0.25); }

// ═══════════════════════════════════════════════════
//  WAKE LOCK
// ═══════════════════════════════════════════════════
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_) {}
}

async function releaseWakeLock() {
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (_) {}
}

// Re-acquire if page becomes visible again while a session is active
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (sessionState || hiitState)) {
    requestWakeLock();
  } else {
    releaseWakeLock();
  }
});

// ═══════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════
let currentNav = 'workouts';

function navTo(tab) {
  currentNav = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  if (tab === 'workouts') {
    showScreen('screen-workouts');
    renderWorkoutList();
    renderHistory();
  } else {
    showScreen('screen-hiit');
    loadHIITConfig();
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const isMain = id === 'screen-workouts' || id === 'screen-hiit';
  document.getElementById('bottom-nav').style.display = isMain ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════════
//  WORKOUT LIST
// ═══════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderWorkoutList() {
  const workouts = load(KEYS.workouts);
  const history  = load(KEYS.history);
  const el = document.getElementById('workout-list');

  if (!workouts.length) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M2 9.5l2 2.5-2 2.5M22 9.5l-2 2.5 2 2.5"/>
      </svg>
      <p>Noch keine Workouts.<br>Erstelle dein erstes Workout!</p>
    </div>`;
    return;
  }

  el.innerHTML = workouts.map((w, i) => {
    const sessions = history.filter(h => h.workoutId === w.id);
    const last = sessions.length ? new Date(sessions[sessions.length-1].date).toLocaleDateString('de-DE') : 'Nie';
    return `<div class="workout-card">
      <div class="workout-card-info">
        <div class="workout-card-name">${esc(w.name)}</div>
        <div class="workout-card-meta">${w.exercises.length} Übungen · Zuletzt: ${last}</div>
      </div>
      <div class="workout-card-actions">
        <button class="btn-icon" title="Duplizieren" onclick="duplicateWorkout(${i})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button class="btn-icon" title="Bearbeiten" onclick="showBuilderScreen(${i})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon" title="Löschen" onclick="deleteWorkout(${i})" style="color:var(--accent-red)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
      <button class="btn btn-primary btn-sm" onclick="startWorkout(${i})">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Starten
      </button>
    </div>`;
  }).join('');
}

function deleteWorkout(i) {
  if (!confirm('Workout löschen?')) return;
  const workouts = load(KEYS.workouts);
  workouts.splice(i, 1);
  save(KEYS.workouts, workouts);
  renderWorkoutList();
}

function duplicateWorkout(i) {
  const workouts = load(KEYS.workouts);
  const src = workouts[i];
  const copy = {
    id:        Date.now().toString(),
    name:      'Kopie von ' + src.name,
    exercises: JSON.parse(JSON.stringify(src.exercises))
  };
  // Insert at the top
  workouts.unshift(copy);
  save(KEYS.workouts, workouts);
  // Open the copy (now at index 0) in the editor immediately
  showBuilderScreen(0);
}

// ═══════════════════════════════════════════════════
//  WORKOUT BUILDER
// ═══════════════════════════════════════════════════
let editingWorkoutIndex = null;

function showBuilderScreen(workoutIndex) {
  editingWorkoutIndex = workoutIndex;
  const titleEl = document.getElementById('builder-title');
  const nameEl  = document.getElementById('workout-name-input');
  const listEl  = document.getElementById('exercise-list');

  listEl.innerHTML = '';

  if (workoutIndex !== null) {
    const w = load(KEYS.workouts)[workoutIndex];
    titleEl.textContent = 'Workout bearbeiten';
    nameEl.value = w.name;
    w.exercises.forEach(ex => addExerciseRow(ex));
  } else {
    titleEl.textContent = 'Workout erstellen';
    nameEl.value = '';
    addExerciseRow();
  }

  showScreen('screen-builder');
  enableDragReorder(listEl);
}

function addExerciseRow(ex = null) {
  const listEl = document.getElementById('exercise-list');

  // Insert-line indicator (above each row)
  const insertLine = document.createElement('div');
  insertLine.className = 'drag-insert-above';

  const row = document.createElement('div');
  row.className = 'exercise-row';

  // ── Header ──
  const header = document.createElement('div');
  header.className = 'exercise-row-header';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.title = 'Ziehen zum Sortieren';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.placeholder = 'Übungsname';
  nameInput.className = 'ex-name';
  nameInput.value = ex ? esc(ex.name) : '';
  nameInput.style.flex = '1';

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-icon';
  delBtn.style.color = 'var(--accent-red)';
  delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  delBtn.onclick = () => { insertLine.remove(); row.remove(); };

  header.appendChild(handle);
  header.appendChild(nameInput);
  header.appendChild(delBtn);

  // ── Number input fields ──
  const fields = document.createElement('div');
  fields.className = 'exercise-fields';

  function makeInputGroup(label, cls, min, max, step, defVal, unit) {
    const group = document.createElement('div');
    group.className = 'ex-input-group';
    const lbl = document.createElement('div');
    lbl.className = 'eig-label';
    lbl.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.className = cls;
    inp.min = min; inp.max = max; inp.step = step; inp.value = defVal;
    const unitEl = document.createElement('div');
    unitEl.className = 'eig-unit';
    unitEl.textContent = unit;
    group.appendChild(lbl);
    group.appendChild(inp);
    group.appendChild(unitEl);
    return group;
  }

  fields.appendChild(makeInputGroup('Sätze',  'ex-sets',   1,   20, 1, ex ? ex.sets   : 3,  'Sätze'));
  fields.appendChild(makeInputGroup('Wdh.',   'ex-reps',   1,   50, 1, ex ? ex.reps   : 10, 'Wdh.'));
  fields.appendChild(makeInputGroup('Gewicht','ex-weight',  0,  200, 1, ex ? ex.weight : 0,  'kg'));

  row.appendChild(header);
  row.appendChild(fields);

  listEl.appendChild(insertLine);
  listEl.appendChild(row);
}

function saveWorkout() {
  const name = document.getElementById('workout-name-input').value.trim();
  if (!name) { alert('Bitte einen Namen eingeben.'); return; }

  const rows = [...document.querySelectorAll('#exercise-list .exercise-row')];
  const exercises = [];
  rows.forEach(row => {
    const n = row.querySelector('.ex-name').value.trim();
    if (!n) return;
    exercises.push({
      name:   n,
      sets:   Math.max(1,  parseInt(row.querySelector('.ex-sets').value)   || 1),
      reps:   Math.max(1,  parseInt(row.querySelector('.ex-reps').value)   || 1),
      weight: Math.max(0,  parseInt(row.querySelector('.ex-weight').value) || 0)
    });
  });

  if (!exercises.length) { alert('Bitte mindestens eine Übung hinzufügen.'); return; }

  const workouts = load(KEYS.workouts);
  if (editingWorkoutIndex !== null) {
    const id = workouts[editingWorkoutIndex].id;
    workouts[editingWorkoutIndex] = { id, name, exercises };
  } else {
    workouts.push({ id: Date.now().toString(), name, exercises });
  }
  save(KEYS.workouts, workouts);
  showScreen('screen-workouts');
  renderWorkoutList();
}

function cancelBuilder() {
  showScreen('screen-workouts');
  renderWorkoutList();
}

// ═══════════════════════════════════════════════════
//  DRAG-TO-REORDER (exercise builder)
// ═══════════════════════════════════════════════════
function enableDragReorder(listEl) {
  let dragEl = null, dragInsert = null, ghostEl = null, offsetY = 0;

  listEl.addEventListener('pointerdown', startDrag, { passive: false });

  function startDrag(e) {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const row = handle.closest('.exercise-row');
    if (!row) return;

    e.preventDefault();
    dragEl = row;
    dragInsert = dragEl.previousElementSibling; // the insert-line div above it

    const rect = row.getBoundingClientRect();
    offsetY = e.clientY - rect.top;

    // Ghost clone
    ghostEl = row.cloneNode(true);
    ghostEl.style.cssText = `
      position:fixed; left:${rect.left}px; top:${rect.top}px;
      width:${rect.width}px; z-index:500; pointer-events:none;
      opacity:0.92; border-radius:8px; background:var(--elevated);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
    `;
    document.body.appendChild(ghostEl);
    row.style.opacity = '0.3';

    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup',   onEnd);
    document.addEventListener('pointercancel', onEnd);
  }

  function onMove(e) {
    if (!dragEl) return;
    e.preventDefault();

    const newTop = e.clientY - offsetY;
    ghostEl.style.top = newTop + 'px';

    // Find target position among rows (excluding dragged one)
    const allRows = [...listEl.querySelectorAll('.exercise-row')].filter(r => r !== dragEl);
    const allLines = [...listEl.querySelectorAll('.drag-insert-above')];

    // Hide all insert lines
    allLines.forEach(l => l.classList.remove('show'));

    let insertBeforeRow = null;
    let insertBeforeLine = null;
    for (const r of allRows) {
      const rect = r.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        insertBeforeRow  = r;
        insertBeforeLine = r.previousElementSibling;
        break;
      }
    }

    if (insertBeforeRow) {
      insertBeforeLine && insertBeforeLine.classList.add('show');
      listEl.insertBefore(dragInsert, insertBeforeRow.previousElementSibling);
      listEl.insertBefore(dragEl, insertBeforeRow);
    } else {
      // Append at end
      listEl.appendChild(dragInsert);
      listEl.appendChild(dragEl);
    }
  }

  function onEnd() {
    if (!dragEl) return;
    dragEl.style.opacity = '';
    ghostEl && ghostEl.remove();
    // Hide all insert lines
    listEl.querySelectorAll('.drag-insert-above').forEach(l => l.classList.remove('show'));
    dragEl = ghostEl = dragInsert = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onEnd);
    document.removeEventListener('pointercancel', onEnd);
  }
}

// ═══════════════════════════════════════════════════
//  ACTIVE WORKOUT SESSION
// ═══════════════════════════════════════════════════
let sessionState = null;
let sessionInterval = null;
let restInterval = null;

function startWorkout(i) {
  const workout = load(KEYS.workouts)[i];
  sessionState = {
    workoutId:   workout.id,
    workoutName: workout.name,
    startTime:   Date.now(),
    exercises:   workout.exercises.map(ex => ({
      ...ex,
      sets: Array.from({length: ex.sets}, (_, si) => ({
        index: si, targetReps: ex.reps, targetWeight: ex.weight, done: false
      }))
    })),
    elapsed: 0
  };
  renderActiveWorkout();
  showScreen('screen-active');
  document.getElementById('bottom-nav').style.display = 'none';
  requestWakeLock();
  clearInterval(sessionInterval);
  sessionInterval = setInterval(() => {
    sessionState.elapsed = Math.floor((Date.now() - sessionState.startTime) / 1000);
    document.getElementById('session-clock').textContent = formatTime(sessionState.elapsed);
  }, 1000);
}

function renderActiveWorkout() {
  const el = document.getElementById('active-exercise-list');
  el.innerHTML = sessionState.exercises.map((ex, ei) => {
    const setsHtml = ex.sets.map((set, si) => `
      <div class="set-row${set.done ? ' done' : ''}" id="setrow-${ei}-${si}">
        <div class="check-wrap" onclick="toggleSet(${ei},${si})">
          <input type="checkbox" ${set.done ? 'checked' : ''}>
          <div class="check-box"></div>
        </div>
        <div class="set-label">Satz ${si+1}</div>
        <div class="set-info">${set.targetReps} Wdh. · ${set.targetWeight} kg</div>
      </div>`).join('');
    return `<div class="ex-session-card">
      <div class="ex-session-header">${esc(ex.name)}</div>
      ${setsHtml}
    </div>`;
  }).join('');
}

function toggleSet(ei, si) {
  const set = sessionState.exercises[ei].sets[si];
  set.done = !set.done;
  const row = document.getElementById(`setrow-${ei}-${si}`);
  row.classList.toggle('done', set.done);
  row.querySelector('input[type=checkbox]').checked = set.done;
  if (set.done) {
    const restSecs = parseInt(document.getElementById('rest-duration-input').value) || 60;
    startRestTimer(restSecs);
    soundRestBeep();
  }
}

function startRestTimer(secs) {
  clearInterval(restInterval);
  let remaining = secs;
  const overlay  = document.getElementById('rest-overlay');
  const countEl  = document.getElementById('rest-count');
  overlay.style.display = 'flex';
  countEl.textContent = remaining;
  restInterval = setInterval(() => {
    remaining--;
    countEl.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(restInterval);
      overlay.style.display = 'none';
      beep(880, 0.3, 'sine', 0.4);
    }
  }, 1000);
}

function skipRest() {
  clearInterval(restInterval);
  document.getElementById('rest-overlay').style.display = 'none';
}

function endWorkout() {
  if (!confirm('Workout beenden und speichern?')) return;
  clearInterval(sessionInterval);
  clearInterval(restInterval);
  releaseWakeLock();
  document.getElementById('rest-overlay').style.display = 'none';

  const totalSets = sessionState.exercises.reduce((a, ex) => a + ex.sets.length, 0);
  const doneSets  = sessionState.exercises.reduce((a, ex) => a + ex.sets.filter(s => s.done).length, 0);

  const record = {
    id:           Date.now().toString(),
    workoutId:    sessionState.workoutId,
    workoutName:  sessionState.workoutName,
    date:         new Date().toISOString(),
    duration:     sessionState.elapsed,
    setsCompleted:doneSets,
    totalSets,
    exercises: sessionState.exercises.map(ex => ({
      name:          ex.name,
      setsCompleted: ex.sets.filter(s => s.done).length,
      totalSets:     ex.sets.length,
      targetReps:    ex.reps,
      targetWeight:  ex.weight
    }))
  };

  const history = load(KEYS.history);
  history.push(record);
  save(KEYS.history, history);

  sessionState = null;
  navTo('workouts');
  renderWorkoutList();
  renderHistory();
  setTimeout(() => switchWorkoutTab('history', document.querySelectorAll('.sub-tab')[1]), 100);
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════════
function renderHistory() {
  const history = load(KEYS.history).slice().reverse();
  const el = document.getElementById('history-list');

  if (!history.length) {
    el.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <p>Noch keine Trainingseinheiten.<br>Starte dein erstes Workout!</p>
    </div>`;
    return;
  }

  el.innerHTML = history.map((h, i) => {
    const date = new Date(h.date).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'});
    const time = new Date(h.date).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
    const detailHtml = (h.exercises || []).map(ex =>
      `<div class="history-detail-ex">${esc(ex.name)} — ${ex.setsCompleted}/${ex.totalSets} Sätze · ${ex.targetReps} Wdh. · ${ex.targetWeight} kg</div>`
    ).join('');
    return `<div class="history-card" id="hcard-${h.id}">
      <div class="history-card-header" onclick="toggleHistoryDetail('${h.id}')">
        <div class="history-card-left">
          <div class="history-card-name">${esc(h.workoutName)}</div>
          <div class="history-card-date">${date} · ${time}</div>
        </div>
        <div class="history-card-right">
          <div class="history-card-stats">
            <div class="history-stat"><strong>${formatTime(h.duration)}</strong>Zeit</div>
            <div class="history-stat"><strong>${h.setsCompleted}/${h.totalSets}</strong>Sätze</div>
          </div>
          <button class="btn-icon" style="color:var(--accent-red);flex-shrink:0;"
            onclick="event.stopPropagation(); showHistoryDeleteConfirm('${h.id}')" title="Löschen">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
              <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="history-delete-confirm" id="hdel-${h.id}">
        <span>Wirklich löschen?</span>
        <button class="hdc-confirm" onclick="confirmDeleteHistory('${h.id}')">Ja, löschen</button>
        <button class="hdc-cancel"  onclick="cancelDeleteHistory('${h.id}')">Abbrechen</button>
      </div>
      <div class="history-detail" id="hdetail-${h.id}">${detailHtml}</div>
    </div>`;
  }).join('');
}

function toggleHistoryDetail(id) {
  document.getElementById('hdetail-' + id).classList.toggle('open');
}

function showHistoryDeleteConfirm(id) {
  // Hide any other open confirms first
  document.querySelectorAll('.history-delete-confirm.show').forEach(el => el.classList.remove('show'));
  document.getElementById('hdel-' + id).classList.add('show');
}

function cancelDeleteHistory(id) {
  document.getElementById('hdel-' + id).classList.remove('show');
}

function confirmDeleteHistory(id) {
  let history = load(KEYS.history);
  history = history.filter(h => h.id !== id);
  save(KEYS.history, history);
  renderHistory();
}

function switchWorkoutTab(tab, btn) {
  document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('workout-list-tab').style.display   = tab === 'list'    ? 'block' : 'none';
  document.getElementById('workout-history-tab').style.display = tab === 'history' ? 'block' : 'none';
}

// ═══════════════════════════════════════════════════
//  HIIT TIMER
// ═══════════════════════════════════════════════════
let hiitState    = null;
let hiitInterval = null;

function loadHIITConfig() {
  const cfg = loadObj(KEYS.hiit, { rounds: 8, work: 40, rest: 20 });
  document.getElementById('hiit-rounds').value = Math.max(1,  Math.min(30,  cfg.rounds || 8));
  document.getElementById('hiit-work').value   = Math.max(10, Math.min(300, cfg.work   || 40));
  document.getElementById('hiit-rest').value   = Math.max(10, Math.min(300, cfg.rest   || 20));
}

function startHIIT() {
  const rounds = Math.max(1,  parseInt(document.getElementById('hiit-rounds').value) || 8);
  const work   = Math.max(10, parseInt(document.getElementById('hiit-work').value)   || 40);
  const rest   = Math.max(10, parseInt(document.getElementById('hiit-rest').value)   || 20);
  save(KEYS.hiit, { rounds, work, rest });

  hiitState = {
    rounds, work, rest,
    currentRound:  1,
    phase:         'work',
    remaining:     work,
    phaseDuration: work,
    paused:        false,
    done:          false,
    startTime:     Date.now()
  };
  soundWorkStart();
  renderHIITActive();
  requestWakeLock();

  document.getElementById('hiit-config-view').style.display = 'none';
  document.getElementById('hiit-active-view').style.display = 'flex';

  clearInterval(hiitInterval);
  hiitInterval = setInterval(tickHIIT, 1000);
}

function tickHIIT() {
  if (!hiitState || hiitState.paused || hiitState.done) return;
  hiitState.remaining--;
  renderHIITActive();
  if (hiitState.remaining <= 0) advanceHIITPhase();
}

function advanceHIITPhase() {
  const s = hiitState;
  if (s.phase === 'work') {
    if (s.currentRound >= s.rounds) {
      s.done = true;
      clearInterval(hiitInterval);
      soundEnd();
      releaseWakeLock();
      saveHIITHistory(s, s.rounds);
      document.getElementById('hiit-phase-label').textContent = 'FERTIG!';
      document.getElementById('hiit-phase-label').className   = 'hiit-phase';
      document.getElementById('hiit-phase-label').style.color = 'var(--accent)';
      document.getElementById('hiit-countdown').textContent   = '✓';
      document.getElementById('hiit-round-label').textContent = `${s.rounds} Runden abgeschlossen`;
      document.getElementById('hiit-progress-fill').style.width = '100%';
      return;
    }
    s.phase = 'rest';
    s.remaining = s.phaseDuration = s.rest;
    soundRestStart();
  } else {
    s.currentRound++;
    s.phase = 'work';
    s.remaining = s.phaseDuration = s.work;
    soundWorkStart();
  }
  renderHIITActive();
}

function renderHIITActive() {
  const s = hiitState;
  const phaseEl   = document.getElementById('hiit-phase-label');
  const countEl   = document.getElementById('hiit-countdown');
  const roundEl   = document.getElementById('hiit-round-label');
  const fillEl    = document.getElementById('hiit-progress-fill');
  const pauseBtn  = document.getElementById('hiit-pause-btn');

  phaseEl.textContent = s.phase === 'work' ? 'BELASTUNG' : 'PAUSE';
  phaseEl.className   = `hiit-phase ${s.phase}`;
  phaseEl.style.color = '';
  countEl.textContent = s.remaining;
  roundEl.textContent = `Runde ${s.currentRound} / ${s.rounds}`;

  const pct = s.phaseDuration > 0 ? (s.remaining / s.phaseDuration) * 100 : 0;
  fillEl.style.width      = pct + '%';
  fillEl.style.background = s.phase === 'work' ? 'var(--accent-red)' : 'var(--accent)';

  pauseBtn.textContent = s.paused ? 'Weiter' : 'Pause';
}

function toggleHIITPause() {
  if (!hiitState) return;
  hiitState.paused = !hiitState.paused;
  document.getElementById('hiit-pause-btn').textContent = hiitState.paused ? 'Weiter' : 'Pause';
}

function stopHIIT() {
  if (hiitState && !hiitState.done) {
    // Count fully completed work rounds
    const completedRounds = hiitState.phase === 'rest'
      ? hiitState.currentRound          // just finished that work phase
      : hiitState.currentRound - 1;     // stopped mid-work
    saveHIITHistory(hiitState, Math.max(0, completedRounds));
  }
  clearInterval(hiitInterval);
  releaseWakeLock();
  hiitState = null;
  document.getElementById('hiit-active-view').style.display = 'none';
  document.getElementById('hiit-config-view').style.display = 'block';
  renderHIITVerlauf();
}

// ═══════════════════════════════════════════════════
//  HIIT HISTORY
// ═══════════════════════════════════════════════════
function saveHIITHistory(s, roundsDone) {
  const elapsed = Math.floor((Date.now() - s.startTime) / 1000);
  const entry = {
    id:           Date.now().toString(),
    date:         new Date().toISOString(),
    rounds:       s.rounds,
    roundsDone:   roundsDone,
    work:         s.work,
    rest:         s.rest,
    elapsed
  };
  const hist = load(KEYS.hiitHistory);
  hist.push(entry);
  save(KEYS.hiitHistory, hist);
}

function toggleHIITVerlauf(btn) {
  const list = document.getElementById('hiit-verlauf-list');
  const open = list.classList.toggle('open');
  btn.textContent = open ? 'Verlauf ausblenden' : 'Verlauf anzeigen';
  if (open) renderHIITVerlauf();
}

function renderHIITVerlauf() {
  const list = document.getElementById('hiit-verlauf-list');
  if (!list.classList.contains('open')) return;

  const hist = load(KEYS.hiitHistory).slice().reverse();
  if (!hist.length) {
    list.innerHTML = '<div class="hiit-hist-empty">Noch keine HIIT Sessions gespeichert</div>';
    return;
  }

  const DE_DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  list.innerHTML = hist.map(h => {
    const d = new Date(h.date);
    const dayStr = DE_DAYS[d.getDay()];
    const dateStr = d.toLocaleDateString('de-DE', {day:'2-digit', month:'long', year:'numeric'});
    return `<div class="hiit-hist-card">
      <div class="hiit-hist-header">
        <div class="hiit-hist-info">
          <div class="hiit-hist-date">${dayStr}, ${dateStr}</div>
          <div class="hiit-hist-meta">
            ${h.roundsDone} / ${h.rounds} Runden &nbsp;·&nbsp;
            💪 ${h.work}s &nbsp;|&nbsp; ⏸ ${h.rest}s &nbsp;·&nbsp;
            Gesamtdauer: ${formatTime(h.elapsed)}
          </div>
        </div>
        <button class="hiit-hist-del" onclick="showHIITHistConfirm('${h.id}')" title="Löschen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="hiit-hist-confirm" id="hhc-${h.id}">
        <span>Wirklich löschen?</span>
        <button class="hdc-confirm" onclick="confirmHIITHistDelete('${h.id}')">Ja</button>
        <button class="hdc-cancel"  onclick="cancelHIITHistDelete('${h.id}')">Abbrechen</button>
      </div>
    </div>`;
  }).join('');
}

function showHIITHistConfirm(id) {
  document.querySelectorAll('.hiit-hist-confirm.show').forEach(el => el.classList.remove('show'));
  document.getElementById('hhc-' + id).classList.add('show');
}
function cancelHIITHistDelete(id) {
  document.getElementById('hhc-' + id).classList.remove('show');
}
function confirmHIITHistDelete(id) {
  let hist = load(KEYS.hiitHistory);
  hist = hist.filter(h => h.id !== id);
  save(KEYS.hiitHistory, hist);
  renderHIITVerlauf();
}

showScreen('screen-workouts');
document.getElementById('bottom-nav').style.display = 'flex';
renderWorkoutList();
renderHistory();
loadHIITConfig();

// Block all body/page scroll from touch swipe globally
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Allow internal scrollable containers to scroll without moving the page
document.querySelectorAll('.screen').forEach(el => {
  el.addEventListener('touchmove', e => e.stopPropagation(), { passive: true });
});
document.getElementById('hiit-verlauf-list').addEventListener('touchmove', e => e.stopPropagation(), { passive: true });

// Unlock audio context on first user interaction
document.body.addEventListener('touchstart', () => getAudioCtx(), { once: true, passive: true });
document.body.addEventListener('click',      () => getAudioCtx(), { once: true });
</script>
